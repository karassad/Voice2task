<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация успешна!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
        }
        .container {
            background-color: #ffffff;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
            box-sizing: border-box;
            border: 1px solid #e0e0e0;
        }
        h2 {
            color: #4CAF50; /* Green for success */
            margin-bottom: 20px;
            font-size: 2em;
            font-weight: 600;
        }
        p {
            font-size: 1.1em;
            line-height: 1.6;
            color: #555;
        }
        .icon {
            font-size: 3em;
            margin-bottom: 15px;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✅</div>
        <h2>Вы успешно авторизовались!</h2>
        <p>Теперь Вы можете вернуться в Telegram-бота и продолжить работу.</p>
    </div>
</body>
</html>
